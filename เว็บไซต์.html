<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับสู่เว็บไซต์</title>
    <style>
        /* จัดการพื้นหลังเว็บเป็นสีชมพูเข้ม */
        body {
            background-color: #8B004F; /* สีชมพูเข้ม (Magenta / Deep Pink) */
            color: #FFC0CB; /* สีชมพูอ่อน (Light Pink) */
            font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        /* ตกแต่งกล่องข้อความ */
        .welcome-card {
            background-color: rgba(255, 255, 255, 0.05); /* กล่องใสโปร่งแสงเล็กน้อย */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 192, 203, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.5rem;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>ยินดีต้อนรับสู่เว็บไซต์</h1>
        <p>นางสาวภัทรินทร์ แสงสิน</p>
        <p>ชั้น ม.6/5 เลขที่ 31</p>
    </div>

</body>
</html>
