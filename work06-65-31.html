<!DOCTYPE html>
<html lang="th">
<head>
<title>work06 html link color</title>
<meta charset="utf-8">
<style>
a:link{
    color:green;
    text-decoration:none;
    background-color:#ED951A;
    display:block;
    width:150px;
    padding:5px;
}
a:visited{
    color:red;
}
a:hover{
    color:blue;
    background-color:#62ED39;
}
a:active{
    color:purple;
}
</style>

</head>

<body>
<ul style="list-style-type:none">
<li><a href="">ผัดกะเพรา</a></li>
<li><a href="">ผัดพริกแกง</a></li>
<li><a href="">ผัดผงกะหรี่</a></li>
</ul>
</body>
</html>
